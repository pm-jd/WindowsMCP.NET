name: Build & Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 10
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore
      run: dotnet restore WindowsMCP.NET.slnx

    - name: Build
      run: dotnet build WindowsMCP.NET.slnx --configuration Release --no-restore

    - name: Test (Unit)
      run: dotnet test tests/WindowsMCP.NET.Tests/ --configuration Release --no-build

    # Microsoft.Testing.Platform (xunit v3) filter syntax; Schema needs the Python baseline, Desktop needs a real session.
    - name: Test (Parity - dotnet only)
      run: dotnet test tests/WindowsMCP.NET.ParityTests/ --configuration Release --no-build --filter-not-trait "Category=Schema" --filter-not-trait "Category=Desktop"
      env:
        PARITY_SERVER: dotnet

    - name: Publish (single-file, self-contained)
      run: dotnet publish src/WindowsMCP.NET/WindowsMCP.NET.csproj -c Release -r win-x64

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: WindowsMCP.NET
        path: src/WindowsMCP.NET/bin/Release/net10.0-windows/win-x64/publish/
